<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Spotify Clone</title>
    <link rel="icon" type="image/png" href="./covers/logo.png">

<body>
    <nav>
        <ul>
            <li class="brand"><a href="index.html"><img src="./covers/logo.png" alt="Spotify"></a>Spotify</li>

    <main>
        <div class="container">
            <div class="song-list">

                        </span> 
                    </div>

                    <div class="song-item">
                        <img alt="2">

                    </div>
                

                    <div class="song-item">
                        <img alt="3">
                        <span class="song-name">Love Nawantiti</span>
                        <span class="song-list-play">
                            <span class="time-stamp">02:55 <i id="2" class="far song-item-play fa-play-circle"></i></span>

                    </div>

                    <div class="song-item">

                    </div>

                    <div class="song-item">

                    <div class="song-item">

                        </span> 
                    </div>

                    <div class="song-item">
                        <img alt="7">
                        <span class="song-name">Fell For You</span>

                </div>
            </div>
        <div class="song-banner"></div>
    </div>
</main>
    <!--footer-->
        <div class="bottom">
            <input type="range" name="range" id="myProgress" value="0" min="0" max="100">
            <div class="icons">
                <!-- fontawesome icons -->
                <i class="fa-3x fa-solid fa-backward" id="previous"></i>           
                <i class="fa-3x far fa-play-circle" id="masterPlay"></i>
                <i class="fa-3x fa-solid fa-forward" id="next"></i>           
            </div>
            <div class="song-info" id="myProgressBar">
                <img src="./covers/playing.gif" width="42px" id="gif"> 
                 <span id="master-song-name">Dil Ibadat</span> 
            </div>
        </div>

 </body>
